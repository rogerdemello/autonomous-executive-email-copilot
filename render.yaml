# Render Blueprint — deploys the Dockerfile as a single web service (FastAPI
# serving both the JSON API and the server-rendered UI) plus a managed
# Postgres. Render injects $PORT, which the container binds automatically
# (see Dockerfile / app.main:main).
#
# Deploy: push to GitHub, then in Render → New → Blueprint and point it at this
# repo. Values marked `sync: false` are set in the Render dashboard (never in
# git); `generateValue: true` secrets are minted once by Render and persist
# across deploys.
#
# ⚠ BACK UP the generated AUTH_SECRET_KEY (dashboard → Environment). It signs
# every session, license key, CSRF token, and the OAuth-token encryption key.
# Deleting/recreating the service regenerates it, which invalidates every
# license key you have ever issued to a customer.
#
# ⚠ Both services are on paid plans on purpose. Render's FREE Postgres is
# deleted ~30 days after creation, and a free web service sleeps — a sleeping
# instance runs no background sync, so the approval queue never fills on its
# own. Downgrade only for a throwaway demo.
#
# ⚠ Values marked `sync: false` below are REQUIRED, not optional. Without SMTP,
# password resets are logged instead of sent. Without the OAuth client IDs, no
# real Gmail or Microsoft 365 mailbox can be connected at all.
services:
  - type: web
    name: exec-email-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # ⚠ do NOT use `free`: it sleeps, and a sleeping instance
      # runs no background sync and re-seeds the demo on every cold start.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Production posture -------------------------------------------------
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: SIGNUP_ENABLED
        value: "true" # self-serve: signup provisions an org + a 14-day trial
      - key: APP_PUBLIC_URL
        value: https://exec-email-copilot.onrender.com
      - key: ALLOWED_HOSTS
        value: exec-email-copilot.onrender.com
      # --- The public demo ----------------------------------------------------
      # "Try the live demo" builds every visitor a private sandbox workspace on
      # demand (app/saas/sandbox.py): one click, no password, nothing that has to
      # have been seeded, and it works on an empty or freshly wiped database.
      # Production must opt in, which is what this does.
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      # Optional now. Seeds the *shared* demo account (a prefilled sign-in some
      # sales calls prefer, and what `make demo` gives you locally). The one-click
      # demo does not depend on it.
      - key: DEMO_SEED_ON_STARTUP
        value: "true"
      # --- Operator API + benchmark-surface lock ------------------------------
      - key: OPERATOR_TOKEN
        generateValue: true # read it in the dashboard; used for /operator/*
      - key: API_AUTH_TOKEN
        generateValue: true # closes the benchmark POST + sensitive-read surface
      # --- The product's actual behaviour -------------------------------------
      # Without these three the deployment is a demo, not a product: the
      # approval queue only fills when someone clicks Sync, and every urgent
      # reply is the generic sentence in app/copilot/policy.py rather than a
      # model-written draft.
      - key: SYNC_WORKER_ENABLED
        value: "true" # background sync: the queue fills on its own
      - key: SYNC_WORKER_INTERVAL_SECONDS
        value: "900" # every 15 min per connection, with per-connection jitter
      - key: LLM_DRAFTING_ENABLED
        value: "true" # requires a key below; falls back safely without one
      # ⚠ The ceiling on what one workspace can spend on the model in a calendar
      # month. Drafting is on and the worker sweeps every mailbox every 15
      # minutes, so this is the only thing standing between a large mailbox and
      # an unbounded bill. Reaching it degrades prose to the deterministic
      # fallback; triage, verification and sending are unaffected. `0` removes
      # the ceiling — don't, until the bill is a line item somebody watches.
      - key: LLM_MONTHLY_BUDGET_USD
        value: "25"
      # --- Abuse limits -------------------------------------------------------
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: LOGIN_RATE_LIMIT_PER_MINUTE
        value: "10"
      # --- Durable storage ----------------------------------------------------
      - key: DATABASE_URL
        fromDatabase:
          name: exec-email-copilot-db
          property: connectionString
      # --- Sales funnel (set in the dashboard) --------------------------------
      # Leave BOTH blank until there is a real mailbox behind them: unset means
      # the footer, privacy policy and terms point at the contact form, and
      # security.txt at GitHub's private vulnerability reporting. (They used to
      # default to sales@example.com, which was published as a live link.)
      - key: SALES_CONTACT_EMAIL
        sync: false
      - key: SECURITY_CONTACT_EMAIL
        sync: false
      - key: SALES_WEBHOOK_URL
        sync: false # optional Slack incoming webhook for new leads
      # --- CORS (pin to the public origin) ------------------------------------
      - key: CORS_ORIGINS
        value: https://exec-email-copilot.onrender.com
      # --- Tracing (optional) -------------------------------------------------
      # The code is instrumented with OpenTelemetry spans (gateway.request,
      # inbox.sync, inbox.approve, the drafter's model call). Set this to an OTLP
      # HTTP collector — Grafana Cloud, Tempo, Honeycomb — to receive them; blank
      # leaves them in-process.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      # --- LLM provider (optional; the demo replays cached drafts) ------------
      - key: OPENAI_API_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        sync: false
      # --- Mailbox OAuth (REQUIRED — set in the dashboard) --------------------
      # Without these, /app/connect shows both providers as unconfigured and the
      # only mailbox anyone can attach is the read-only demo one.
      - key: OAUTH_REDIRECT_BASE_URL
        value: https://exec-email-copilot.onrender.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_TENANT
        value: common # multi-tenant: any Microsoft 365 work or school account
      # --- Transactional email (REQUIRED — set in the dashboard) --------------
      # NOT optional. Left unset, email_provider falls back to `console`, so
      # password-reset links and member-invite passwords are written to the log
      # and never delivered — while the UI tells the user a mail was sent.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: exec-email-copilot-db
    plan: basic-256mb # ⚠ not `free`: free Postgres is deleted after ~30 days
