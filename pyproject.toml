[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-executive-email-copilot"
version = "1.0.0"
description = "An executive email copilot: reads the inbox, triages by risk and deadline, drafts replies, and holds every outbound action for human approval"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Pinned to the CI-verified set (kept in sync with requirements.txt). CI installs
# from here (`pip install -e ".[dev]"`), so leaving these unpinned is what let a
# Starlette release silently break the build. starlette is pinned explicitly even
# though it is transitive via fastapi. Bump deliberately and re-run the suite.
dependencies = [
  "fastapi==0.138.0",
  "starlette==1.3.1",
  "uvicorn==0.49.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",  # server-rendered UI templates (app/web)
  "httpx==0.28.1",
  "scipy==1.15.3",  # 1.16+ needs py3.11, 1.18 needs py3.12; 1.15.3 supports the 3.10-3.12 matrix
  "sqlalchemy==2.0.51",
  "psycopg[binary]==3.3.4",  # Postgres driver; the deploy docs' durable-storage path must actually import
  "fpdf2==2.8.7",
  "openai==2.44.0",
  "email-validator==2.3.0",  # required by pydantic EmailStr in the SaaS auth layer
  "python-multipart==0.0.32",  # required by FastAPI Form(...) — every web login/approve form
  "cryptography==50.0.0",  # audited Fernet AEAD for at-rest OAuth-token encryption
]

[project.optional-dependencies]
# Pinned to the CI-verified set so a tooling release (e.g. a new ruff rule)
# can't fail the build without a deliberate bump.
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "hypothesis==6.155.7",
  "ruff==0.15.19",
  "mypy==2.1.0",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
]

# Kept as an extra for editable installs, but these are also pinned in
# requirements.txt because the container ships them: the app is instrumented and
# the deploy configs set OTEL_EXPORTER_OTLP_ENDPOINT, so leaving them out of the
# image made every span a silent no-op.
otel = [
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

# Non-OpenAI LLM SDKs. The provider classes import these lazily, so the
# extras are only needed when the matching key/LLM_PROVIDER is configured.
providers = [
  "anthropic>=0.40.0",
  "google-generativeai>=0.8.0",
]

redis = [
  "redis>=5.0.0",
]

async_db = [
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
]

loadtest = [
  "locust>=2.30.0",
]

all = [
  "autonomous-executive-email-copilot[otel,providers,redis,async_db,loadtest]",
]

[project.scripts]
server = "app.main:main"

# Ship the product (app*) and the research benchmark (research*) plus the ops
# helpers, including every subpackage, so a built wheel is complete.
[tool.setuptools.packages.find]
include = ["app*", "research*", "telemetry*", "reports*"]

# The web UI is templates, CSS, fonts and images, not Python. Without this a
# wheel would ship app.web as an empty package and every page would 500 on a
# missing template. The static glob is recursive on purpose: the self-hosted
# fonts and product screenshots live in static/fonts/ and static/img/, and a
# non-recursive "static/*" silently drops both.
[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
markers = [
  "golden: golden-snapshot tests; rebaseline only via scripts/regen_golden.py",
]
filterwarnings = [
  # Starlette 1.3's TestClient warns that httpx will be replaced by httpx2; the
  # current httpx works fine. Silence this one known, harmless deprecation.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
  "E501",  # line length is enforced by the formatter, not the linter
  "B008",  # FastAPI intentionally uses callables (Body(), Depends()) as defaults
]

[tool.ruff.lint.per-file-ignores]
# Tests may import for side effects and define fixtures before imports.
"tests/*" = ["E402", "F811"]

[tool.ruff.format]
quote-style = "double"