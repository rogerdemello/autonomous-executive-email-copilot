{% extends "_operator.html" %}
{% block title %}Operator · Executive Email Copilot{% endblock %}

{% block main %}
<div class="auth">
  <div class="auth__card">
    <p class="eyebrow">Deployment health</p>
    <h1>Operator</h1>
    <p class="auth__sub">
      Not a customer workspace. Paste the <code>OPERATOR_TOKEN</code> from your
      host's environment.
    </p>

    {% if error %}
      <div class="banner banner--error" role="alert" id="operator-error" tabindex="-1">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/operator/session">
      <div class="field">
        <label for="operator_token">Operator token</label>
        <input
          id="operator_token"
          name="operator_token"
          type="password"
          class="mono"
          autocomplete="off"
          required
          {% if error %}aria-invalid="true" aria-describedby="operator-error"{% endif %}
        />
      </div>
      <button class="btn btn--primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
