<!doctype html>
<html lang="en" data-theme="{{ theme or '' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Executive Email Copilot{% endblock %}</title>
    <meta
      name="description"
      content="{% block description %}An AI email copilot that understands inbox context. It summarizes long threads, surfaces what matters, drafts context-aware replies, and escalates high-stakes mail with your sign-off where it matters.{% endblock %}"
    />
    <link rel="stylesheet" href="/static/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230e6e62'/><text x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='%2306110f' text-anchor='middle'>EC</text></svg>"
    />
    {# No defer: the saved theme must apply before first paint. Kept in a file
       rather than inline so the CSP needs no inline-script allowance. #}
    <script src="/static/theme-init.js"></script>
  </head>
  <body>
    {% block body %}{% endblock %}
    <script src="/static/app.js" defer></script>
  </body>
</html>
