{% extends "_public.html" %}

{% block title %}Choose a new password · Executive Email Copilot{% endblock %}

{% block main %}
<div class="auth">
  <div class="auth__card">
    <p class="eyebrow">Account recovery</p>
    <h1>Choose a new password</h1>

    {% if error %}<div class="banner banner--error" role="alert">{{ error }}</div>{% endif %}

    <form method="post" action="/reset-password" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <input type="hidden" name="token" value="{{ token }}" />

      <div class="field">
        <label for="password">New password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />
      </div>

      <button class="btn btn--primary btn--block" type="submit">Set new password</button>
    </form>

    <p class="auth__alt">
      Link expired? <a href="/forgot-password">Request a new one</a>
    </p>
  </div>
</div>
{% endblock %}
