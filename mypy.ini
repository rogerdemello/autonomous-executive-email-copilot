[mypy]
python_version = 3.10
ignore_missing_imports = True
no_strict_optional = True
warn_unused_ignores = True
show_error_codes = True
# CI runs `mypy app`, so scope reporting to the app package: imported sibling
# packages (baseline/, benchmark/, reports/) are used for types but their own
# (pre-existing) type debt isn't reported here. Run mypy on them explicitly to
# work it down.
follow_imports = silent

# Type-checking is a REAL gate: the `typecheck` job in ci.yml no longer carries
# continue-on-error, so a new type error fails the build. That is only
# defensible because this list is short and shrinking.
#
# Four modules came off it: app.live_api, app.llm.tools,
# app.llm.providers.gemini_provider and app.llm.providers.circuit_breaker had
# one or two errors each, all real (a persona string that was never narrowed to
# its Literal, an action_type list retyped beside the Literal it validates
# against, a read-only property overriding a writeable attribute). Silencing a
# whole module to hide one genuine bug is the expensive kind of shortcut.
#
# The two below are the remainder: app.main is 21 errors of FastAPI/handler
# plumbing, and openai_provider is 12 of SDK message-param union strictness.
# Do NOT add to this list — new code must type-check.

[mypy-app.main]
ignore_errors = True

[mypy-app.llm.providers.openai_provider]
ignore_errors = True

[mypy-research.sim.learning.trajectory_store]
ignore_errors = True
