name: CI

on:
  push:
    # security-scan-green carries the whole launch pass and is many commits
    # ahead of main. Without it here, none of that work had ever run in CI —
    # the triggers only fired on the default branch and on PRs.
    branches: [main, master, security-scan-green]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same pin as pyproject's dev extra: an unpinned install let a new ruff
      # release reformat docstring code examples and fail the build with no
      # code change. Bump both places together.
      - run: pip install "ruff==0.15.19"
      - name: ruff lint
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest + coverage gate
        run: >-
          python -m pytest -q
          --cov=app --cov=research --cov=reports --cov=telemetry
          --cov-report=xml --cov-report=term-missing --cov-fail-under=78
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
        continue-on-error: true  # don't fail CI when no token is configured
      # "Measured, not guessed" is the heading over the landing page's proof
      # section. This is what makes it enforceable: the deterministic benchmark
      # columns and the demo-workspace counts are re-run and compared against
      # the committed artifact the page renders, so a policy change that moves
      # a score turns the build red instead of quietly making the page wrong.
      - name: Landing benchmark artifact is still true
        if: matrix.python-version == '3.12'
        run: python scripts/build_landing_metrics.py --check
      - name: Draft-quality gate (deterministic rubric over the committed drafts)
        if: matrix.python-version == '3.12'
        run: python scripts/eval_drafts.py --json draft_quality_report.json
      - name: Upload draft-quality report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: draft-quality-report
          path: draft_quality_report.json

  # The deploy docs' recommended posture is DATABASE_URL=Postgres; this job is
  # the proof it actually works — driver import, migrations, and the SaaS
  # schema against a real server, not just SQLite.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The short scheme on purpose: exercises the postgres:// normalization
      # exactly as Render's connectionString arrives.
      DATABASE_URL: postgres://copilot:copilot@localhost:5432/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: DB-touching suites against real Postgres
        run: >-
          python -m pytest -q
          tests/test_db_engine.py tests/test_db_migration.py
          tests/test_repositories.py tests/test_saas_api.py
          tests/test_saas_auth_core.py tests/test_saas_licensing.py
          tests/test_saas_data_lifecycle.py tests/test_operator_api.py
          tests/test_demo_guardrails.py

  invariant-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Invariant harness (INV-1..5, property/fuzz, golden, determinism)
        run: python -m pytest tests/harness -q

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true  # informational until the codebase is fully typed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The dev extra pins mypy (2.1.0); installing the project alongside it
      # matters just as much as the pin — with the real dependencies missing,
      # sqlalchemy/fastapi types collapse to Any and mypy reports every
      # dependency-related `type: ignore` as unused.
      - run: pip install -e ".[dev]"
      - run: mypy app --config-file mypy.ini

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit pip-audit
      - name: bandit (SAST)
        run: bandit -r app research reports telemetry -ll
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt
        continue-on-error: true  # advisories may be unfixable upstream; informational

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t exec-email-copilot .
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 exec-email-copilot
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then docker logs app; exit 1; fi
          curl -fsS http://localhost:8000/docs > /dev/null
          curl -fsS http://localhost:8000/ > /dev/null           # landing page
          curl -fsS http://localhost:8000/login > /dev/null      # login page
          docker rm -f app

  inference-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inference (baseline fallback, no provider key)
        run: python research/inference.py --task easy_classification --max-steps 20

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint the chart
        run: helm lint helm/exec-email-copilot
      - name: Render templates (defaults, and with persistence enabled)
        run: |
          helm template smoke helm/exec-email-copilot > /dev/null
          helm template smoke helm/exec-email-copilot \
            --set persistence.enabled=true --set ingress.enabled=true > /dev/null
