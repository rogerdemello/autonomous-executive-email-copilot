name: Draft quality (nightly)

# The CI gate (ci.yml) runs the deterministic rubric on every push. This adds
# the LLM-judge pass on a schedule: grounding / tone / actionability, 1-5 per
# committed draft, uploaded as an artifact so the scores form a trend across
# runs. Without a provider key the judge step degrades to the rubric alone.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rubric + LLM judge (judge is skipped when no key is configured)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/eval_drafts.py --judge --json draft_quality_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: draft-quality-${{ github.run_number }}
          path: draft_quality_report.json
