name: Security Scan

# Procurement-grade security scanning, separate from the fast CI gate:
#   - CodeQL   — static analysis (SAST) for Python, JS/TS and the workflows here
#   - Gitleaks — secret scanning across the history and PR diff
#   - Trivy    — container image vulnerability + misconfiguration scan
# Findings surface in the repo's Security tab (SARIF upload).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write # required to upload SARIF

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `actions` is here because CodeQL was already scanning it. The input
        # below used to be spelled `language`, which is not a valid input name,
        # so it was ignored with a warning and every matrix job fell back to
        # autodetection — "Autodetected languages: python, javascript, actions".
        # Both jobs therefore analysed all three, twice over, under job names
        # that each claimed to be one language. Naming the languages explicitly
        # removes the duplicate work; naming `actions` keeps the coverage that
        # the accident was providing, which is worth keeping in a repo whose
        # workflows handle an API key and a release token.
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          # A SARIF category, not a language input — the "/language:" prefix is
          # the convention GitHub keys separate analyses of the same commit on.
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so historical leaks are caught
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-image:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t exec-email-copilot:scan .
      - name: Scan image
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: exec-email-copilot:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
